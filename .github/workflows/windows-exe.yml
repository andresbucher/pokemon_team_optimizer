name: Build Windows EXE

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --windowed --name PokemonTeamOptimizer --add-data "data;data" Main.py

      - name: Zip output
        run: |
          Compress-Archive -Path dist/PokemonTeamOptimizer/* -DestinationPath dist/PokemonTeamOptimizer-windows.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonTeamOptimizer-windows
          path: dist/PokemonTeamOptimizer-windows.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PokemonTeamOptimizer-windows.zip
